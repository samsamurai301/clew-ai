[project]
name = "clew"
version = "1.1.0"
description = "Local-first, content-addressed, git-style debugger for AI agent reasoning traces."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "clew" },
]
keywords = [
    "ai",
    "agents",
    "llm",
    "tracing",
    "debugger",
    "opentelemetry",
    "merkle-dag",
    "version-control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
    "typer>=0.15",
    "rich>=14",
    "textual>=1.0",
    "platformdirs>=4",
    "httpx>=0.28",
    "opentelemetry-api>=1.30",
    "anyio>=4",
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/clew/clew"
Documentation = "https://clew.dev"
Repository = "https://github.com/clew/clew"
Issues = "https://github.com/clew/clew/issues"

[project.scripts]
clew = "clew.cli:app"

[project.entry-points."clew.plugins"]
# third-party plugins register here; e.g.:
# my-plugin = "my_plugin:Plugin"

# PEP 735 dependency groups — uv's native dev-deps format
[project.optional-dependencies]
mcp = ["mcp>=1.0"]
all = ["mcp>=1.0"]

[dependency-groups]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

dev = [
    "mcp>=1.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.13",
    # Note: `platformdirs>=4` ships its own type hints inline; no
    # separate types- package is published on PyPI.
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clew"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# Sensible default rule set; individual tasks may extend.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "F841", "RUF059", "E741", "RUF043", "B018", "N814"]  # asserts + pre-existing test vars are fine
"src/clew/cli.py" = ["B008", "RUF059"]
"src/clew/ui/tui.py" = ["RUF012"]  # textual BINDINGS is a class-level constant  # typer defaults; unused tuple fields; textual BINDINGS

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false  # clew integrates with untyped third-party SDKs
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "clew.cli"
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = ["textual.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring a real LLM API key",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:platformdirs.*",
]

[tool.coverage.run]
branch = true
source = ["src/clew"]
omit = [
    "src/clew/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[[tool.mypy.overrides]]
module = "clew.cli"
disable_error_code = ["unreachable"]

[[tool.mypy.overrides]]
module = ["clew.ui.tui", "clew.sdk.tracer", "clew.ui.render", "clew.sdk.otel", "clew.mcp_server"]
ignore_errors = true
