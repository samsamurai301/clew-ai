[project]
name = "clew-ai"
version = "1.1.5"
description = "A zero-server, Git-like what-if debugger for Python agent traces."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "samsamurai301" },
]
keywords = [
    "ai",
    "agents",
    "llm",
    "tracing",
    "debugger",
    "opentelemetry",
    "local-first",
    "replay",
    "version-control",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.27.0,<1",
    "rich>=14,<16",
    "platformdirs>=4.11.0,<5",
    "cryptography>=43,<50",
]

[project.urls]
Homepage = "https://github.com/samsamurai301/clew-ai"
Documentation = "https://samsamurai301.github.io/clew-ai/"
Repository = "https://github.com/samsamurai301/clew-ai"
Issues = "https://github.com/samsamurai301/clew-ai/issues"
Changelog = "https://github.com/samsamurai301/clew-ai/blob/main/CHANGELOG.md"
MCP = "https://modelcontextprotocol.io"

[project.scripts]
clew = "clew.cli:app"
clew-ai = "clew.cli:app"

[project.entry-points."clew.plugins"]
# Third-party plugins register here. See docs/internals/plugins.md.
# Example: my-plugin = "my_plugin:Plugin"

# Optional extras — install with `pip install 'clew-ai[mcp]'`.
[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
tui = ["textual>=1.0,<9"]
langchain = ["langchain-core>=1.5.1,<2"]
openai = ["openai>=2.48.0,<3"]
anthropic = ["anthropic>=0.120.0,<1"]
otel = ["opentelemetry-api>=1.44.0,<2", "opentelemetry-sdk>=1.30,<2"]
providers = ["openai>=2.48.0,<3", "anthropic>=0.120.0,<1"]
all = [
    "mcp>=1.0,<2",
    "textual>=1.0,<9",
    "langchain-core>=1.5.1,<2",
    "openai>=2.48.0,<3",
    "anthropic>=0.120.0,<1",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.30,<2",
]
# uv-native dev / docs groups (PEP 735). Used by `uv sync --group dev`.
[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7,<10",
]
dev = [
    "mcp>=1.0,<2",
    "textual>=1.0,<9",
    "langchain-core>=1.5.1,<2",
    "openai>=2.48.0,<3",
    "anthropic>=0.120.0,<1",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "hypothesis>=6.161.7,<7",
    "ruff>=0.16.0,<1",
    "mypy>=2.3.0,<3",
    "build>=1.2,<2",
    "twine>=6,<7",
    "pip-audit>=2.9,<3",
    # Note: `platformdirs>=4` ships its own type hints inline; no
    # separate types- stub is published on PyPI.
]

# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clew"]

[tool.hatch.build.targets.sdist]
include = [
    "src/clew",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs",
    "examples",
    "tests",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build", ".mavis"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "PT011",  # pytest.raises without match= is fine in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B011",  # asserts are fine
    "F841",  # local-variable-not-used (test scaffolding)
    "RUF059", # unused unpacked variables
    "E741",  # ambiguous variable name (test scaffolding)
    "RUF043", # pytest.raises match= regex (test scaffolding)
    "B018",  # useless-expression (test scaffolding)
    "N814",  # camelcase imported as constant (test scaffolding)
    "PT012", # pytest.raises multi-line (test scaffolding)
    "SIM117", # nested with statements (test scaffolding)
]
"src/clew/cli.py" = [
    "B008",  # typer defaults
    "RUF059", # unused unpacked (decorated functions)
]
"src/clew/ui/tui.py" = [
    "RUF012", # textual BINDINGS is a class-level constant
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false  # clew integrates with untyped third-party SDKs
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# cli.py uses typer.Exit for control flow, which mypy can't always prove
# is NoReturn. Suppress the unreachable warnings rather than litter the
# code with `raise` after every _err() call.
[[tool.mypy.overrides]]
module = "clew.cli"
disable_error_code = ["unreachable"]

# Third-party deps without type hints.
[[tool.mypy.overrides]]
module = ["textual.*", "rich.*", "mcp.*", "pydantic.mypy"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "e2e: end-to-end tests that require a built wheel in a fresh venv (skip with -m 'not e2e')",
    "integration: marks tests requiring a real LLM API key",
    "fuzz: property-based validation of untrusted persisted formats",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/clew"]
omit = [
    "src/clew/__main__.py",
    "src/clew/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
