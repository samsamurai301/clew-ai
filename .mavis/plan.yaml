      **Probe E — Lazy OTel:**
      `import clew.sdk` without opentelemetry installed. Confirm no crash. Test by
      running `uv run --no-project python -c "import sys; sys.path.insert(0, '/workspace/clew/src'); import clew.sdk"`.

      ## 3. Verdict

      **PASS** only if every check passes. Paste outputs. **FAIL** with specifics otherwise.
