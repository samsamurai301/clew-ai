version: 1
plan:
  name: 'Build clew — git-for-AI-reasoning trace debugger (v0.1.0 MVP)'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 12
  auto_reject_retries: 1

tasks:
  # ──────────────────────────────────────────────────────────────────────
  # FOUNDATION — locks the design, scaffolds the project, defines data models
  # ──────────────────────────────────────────────────────────────────────
  - id: foundation
    title: 'Architecture spec, data models, project scaffold'
    prompt: |
      You are laying the foundation for **clew** — a local-first, content-addressed,
      git-style debugger for AI agent reasoning traces.

      Working directory: `/workspace/clew/` (currently empty, do everything from scratch).

      ## The vision (so you can write a great spec)

      clew lets a developer:
      1. **Trace** an AI agent's reasoning steps (LLM calls, tool calls, decisions)
      2. **Save** the trace as a Merkle DAG of content-addressed spans
      3. **Branch** the trace at any span (git-style fork) and try a different path
      4. **Replay** the trace against a new model / parameters
      5. **Diff** two runs side-by-side
      6. **Share** a portable, signed trace bundle

      **Tagline:** "git for AI reasoning."
      **Killer features:** local-first + branching + content-addressing + OTel-compatible + portable bundles.
      **Why we win:** LangSmith/Arize/Langfuse/agentlens observe *telemetry*; clew observes *reasoning*
      and lets you rewind, fork, and replay it like git. No other OSS tool does the branching.

      ## Stack — latest stable as of 2026-07-13

      - Python 3.11+ (system has 3.11.2; pin `requires-python = ">=3.11,<3.14"`)
      - **uv 0.11+** for package management (installed at `/root/.local/bin/uv`)
      - pydantic >= 2.11
      - typer >= 0.15
      - rich >= 14
      - textual >= 1.0
      - platformdirs >= 4
      - httpx >= 0.28
      - opentelemetry-api >= 1.30
      - anyio >= 4
      - Dev: pytest >= 8, pytest-asyncio >= 0.24, pytest-cov, ruff, mypy

      Use **uv's native PEP 621 format** (NOT Poetry, NOT setuptools). `[project]` table only.

      ## Deliverables (every file MUST exist and be non-empty)

      1. **`/workspace/clew/ARCHITECTURE.md`** — 5+ pages. Sections:
         - Problem statement (AI reasoning is opaque, current tools see telemetry not reasoning)
         - The clew insight (git's Merkle DAG + content-addressing + branching applied to reasoning)
         - Data model: Span, Trace, Branch, Ref — content-addressed, append-only
         - Storage layout (`.clew/` directory tree, JSONL + SQLite index)
         - CLI surface (init, record, replay, branch, checkout, diff, log, share, tui)
         - SDK surface (`@trace` decorator, span context, OTel bridge)
         - Why we win: comparison vs LangSmith, Arize, Langfuse, agentlens (matrix table)
         - Killer features list (5–7 items, one-liner each)

      2. **`/workspace/clew/PROTOCOL.md`** — 3+ pages. Sections:
         - Trace file format: JSONL of spans, one span per line
         - Span schema (id, trace_id, parent_ids, type, name, attributes, input, output, started_at, ended_at, status)
         - Content addressing: canonical JSON → sha256 hex (explain deterministic serialization)
         - Append-only invariant
         - Branch refs: `.clew/refs/<name>` → span_id
         - Portable bundle: tarball with `.clew/`, `manifest.json`, signature
         - OTel mapping: which `gen_ai.*` attributes we honor
         - 1–2 concrete example spans (real-looking OpenAI completion + tool call)

      3. **`/workspace/clew/pyproject.toml`** — valid PEP 621 / uv-compatible:
         - `name = "clew"`, `version = "0.1.0"`
         - `requires-python = ">=3.11,<3.14"`
         - All deps with `>=` lower bounds (latest stable as above)
         - Entry point: `[project.scripts] clew = "clew.cli:app"`
         - Dev deps in `[dependency-groups] dev = [...]` (uv format)
         - Tool config: `[tool.ruff]` (line-length=100), `[tool.mypy]` (strict), `[tool.pytest.ini_options]` (asyncio_mode=auto)

      4. **`/workspace/clew/src/clew/__init__.py`** — minimal:
         ```python
         __version__ = "0.1.0"
         ```

      5. **`/workspace/clew/src/clew/core/__init__.py`** — empty package marker

      6. **`/workspace/clew/src/clew/core/models.py`** — Pydantic v2 models:
         - `SpanType` enum: `LLM`, `TOOL`, `DECISION`, `OBSERVATION`
         - `SpanStatus` enum: `OK`, `ERROR`, `RUNNING`
         - `Span` model with all fields from PROTOCOL.md; `model_config = ConfigDict(frozen=True, extra="forbid")`
         - `Trace` model: trace_id, root_span_id, spans (list[Span])
         - `Branch` model: name, head_span_id, created_at
         - `Ref` model: name, span_id, updated_at
         - All models frozen (immutable)

      7. **`/workspace/clew/.gitignore`** — Python defaults + `.clew/` + `.venv/`

      8. **`/workspace/clew/LICENSE`** — MIT (Copyright 2026 clew authors)

      9. **`/workspace/clew/src/clew/__main__.py`** — `from clew.cli import app; app()` (CLI will be built later, but stub it)

      ## Style rules

      - Type hints on **every** public function and class
      - `from __future__ import annotations` in all Python files
      - Ruff format (line-length=100, target-version=py311)
      - mypy --strict compatible

      ## Acceptance criteria (MUST all pass before reporting done)

      Run these and confirm:
      ```bash
      cd /workspace/clew && /root/.local/bin/uv sync
      cd /workspace/clew && /root/.local/bin/uv run python -c "from clew.core.models import Span, Trace, SpanType, SpanStatus; print('OK')"
      cd /workspace/clew && /root/.local/bin/uv run python -c "import clew; print(clew.__version__)"
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/clew/core/models.py
      ```

      ARCHITECTURE.md must be ≥ 5 pages (≥ 200 lines). PROTOCOL.md must be ≥ 3 pages (≥ 100 lines).

      ## Important

      - **Do NOT** implement storage, CLI, SDK, or TUI — other tasks own those
      - **Do NOT** use Poetry, setuptools — use uv's native PEP 621
      - **Do NOT** add a CLI implementation — leave `clew/cli.py` for the CLI task
      - Use real-world OTel semantic conventions in PROTOCOL.md (cite https://opentelemetry.io/docs/specs/semconv/gen-ai/)

      ## Report when done

      - List every file created (with line counts)
      - Paste the output of every acceptance-criteria command
      - Note any decisions you made (e.g., specific dep versions, design choices)
    assigned_to: Coder
    verified_by: Verifier
    verify_prompt: |
      You are verifying the **foundation** of clew. The foundation is the source-of-truth spec
      that every downstream task builds on. **Do NOT modify any project files.**

      ## 1. Re-run the producer's claims

