name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publish the current main commit to TestPyPI
        type: choice
        required: true
        options: [testpypi]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.21"
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --all-extras --group docs --frozen
      - name: Read and verify release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "tag $RELEASE_TAG does not match project version v$version" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "tagged commit is not reachable from main" >&2
              exit 1
            }
          elif [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "TestPyPI candidates must be built from the current main commit" >&2
            exit 1
          fi
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src
      - run: uv run pytest -m "not e2e"
      - run: uv run mkdocs build --strict
      - run: uv build --clear --no-sources
      - run: uv run twine check dist/*
      - name: Verify artifact contents
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          wheel="dist/clew_ai-${VERSION}-py3-none-any.whl"
          test -f "$wheel"
          unzip -l "$wheel" | grep 'clew/py.typed'
          python -m venv /tmp/clew-wheel
          /tmp/clew-wheel/bin/pip install "$wheel"
          (cd /tmp && /tmp/clew-wheel/bin/clew demo)
          python -m venv /tmp/clew-sdist
          /tmp/clew-sdist/bin/pip install "dist/clew_ai-${VERSION}.tar.gz"
          (cd /tmp && /tmp/clew-sdist/bin/clew-ai version)
      - name: Record release checksums
        run: |
          mkdir -p release-metadata
          (cd dist && sha256sum * > ../release-metadata/SHA256SUMS)
          (cd dist && sha256sum --check ../release-metadata/SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-distributions
          path: |
            dist/*
            release-metadata/SHA256SUMS
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-distributions
      - run: (cd dist && sha256sum --check ../release-metadata/SHA256SUMS)
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: [build-and-verify, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the published candidate and repeat the user journey
        env:
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          mkdir -p /tmp/candidate
          for attempt in {1..12}; do
            python -m pip download --no-deps --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --dest /tmp/candidate "clew-ai==$VERSION" && break
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 10
          done
          python -m pip install /tmp/candidate/*.whl
          workdir=$(mktemp -d)
          cd "$workdir"
          clew demo
          clew-ai version

  publish-pypi:
    if: github.event_name == 'push'
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-distributions
      - run: (cd dist && sha256sum --check ../release-metadata/SHA256SUMS)
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/

  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-distributions
      - run: (cd dist && sha256sum --check ../release-metadata/SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-metadata/SHA256SUMS
