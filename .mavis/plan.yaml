    timeout_ms: 1800000  # 30 min

  # ──────────────────────────────────────────────────────────────────────
  # CLI — typer-based CLI + textual TUI
  # ──────────────────────────────────────────────────────────────────────
  - id: cli
    title: 'CLI commands + TUI viewer'
    prompt: |
      Build the **CLI** for clew. Read first:
      - `/workspace/clew/ARCHITECTURE.md`
      - The core layer + SDK (already built)

      ## Files you OWN (do NOT touch any other file)

      - `src/clew/cli.py` — typer-based CLI
      - `src/clew/ui/__init__.py` — empty marker
      - `src/clew/ui/tui.py` — textual TUI
      - `src/clew/ui/render.py` — rich-based renderers
      - `tests/test_cli.py`

      ## Functional requirements

      ### `cli.py` (typer)

      All commands have `--help`. Use `rich` for all output.

      - `clew init [path]` — initialize `.clew/` in `path` (default: cwd). Idempotent.
      - `clew record [--name NAME]` — start a recording session. Prints a "Recording to ..." line and stays attached to stdin. On EOF or SIGINT, prints the trace_id and exits 0. (Simple version: just create a trace file with a placeholder span and exit — full streaming is for v0.2.)
      - `clew log [--json]` — list all traces. Default: rich table (trace_id, root_name, span_count, started_at). With `--json`: NDJSON.
      - `clew show <trace_id> [--json]` — show spans in a trace. Default: rich tree. With `--json`: NDJSON.
      - `clew branch <name> [<from_span>]` — create a branch. If `from_span` is omitted, use the current HEAD.
      - `clew branches` — list branches. Rich table.
      - `clew checkout <name>` — switch current branch. Prints "Switched to branch 'name'".
      - `clew replay <trace_id> [--from <span_id>] [--executor mock|recording] [--output PATH]` — replay a trace. Default executor: mock. Output: the new trace_id.
      - `clew diff <trace_a> <trace_b> [--json]` — diff two traces. Default: text. With `--json`: NDJSON.
      - `clew share <trace_id> [--out PATH]` — export a portable bundle (tar.gz with manifest + signature). Default output: `<trace_id>.clew.tgz` in cwd.
      - `clew tui` — launch the textual TUI.
      - `clew version` — print `clew 0.1.0`.
      - Global `--json` flag where applicable.

      Error handling: clean `rich` error panels, exit 1 on error.

      ### `ui/render.py`
      - `render_span_tree(trace: Trace) -> RichTree` — tree with status colors (green=ok, red=error, yellow=running)
      - `render_diff(diff: TraceDiff) -> RenderableType`
      - `render_log(traces: list[TraceSummary]) -> Table`

      ### `ui/tui.py`
      - `class TraceBrowserApp(textual.App)`
      - 3-pane layout:
        - Left: list of traces (DataTable)
        - Right: tree of spans in selected trace (Tree)
        - Bottom: details of selected span (Static with JSON)
      - Keybindings:
        - `q` — quit
        - `enter` — expand/collapse span
        - `b` — create branch from selected span (prompts for name)
        - `r` — replay selected trace
        - `d` — diff with current branch
      - Keyboard-first; mouse not required
      - If no traces exist, show a placeholder message

      ## Tests (pytest, using `typer.testing.CliRunner`)

      - `init` creates `.clew/` and exits 0
      - `init` is idempotent (running twice doesn't error)
      - `version` prints `0.1.0`
      - `log` and `show` and `diff` accept `--json` and output valid JSON
      - `branch` and `branches` and `checkout` roundtrip
      - `replay` with mock executor creates a new trace
      - `share` creates a tar.gz
      - End-to-end: init → record → log → branch → diff → share

      ## Acceptance criteria

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_cli.py -v
      cd /workspace/clew && /root/.local/bin/uv run clew --help
      cd /workspace/clew && /root/.local/bin/uv run clew version
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/cli.py src/clew/ui/
      ```

      All must pass.

      ## Important

      - **Do NOT** touch core, sdk, or utils
      - Use `typer`, not raw `click` or `argparse`
      - Use `rich` for ALL terminal output
      - CLI must feel like `git` — every command has `--help`, sensible defaults, exits 0/1
      - `clew` must work both as `clew` (via entry point) and `python -m clew`

      ## Report when done

      - Test output (all green)
      - Output of `clew --help`
      - Output of `clew version`
      - Files created with line counts
    assigned_to: Coder
    verified_by: Verifier
    verify_prompt: |
      You are verifying the **CLI** of clew. **Do NOT modify any project files.**

      ## 1. Re-run

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_cli.py -v
      cd /workspace/clew && /root/.local/bin/uv run clew --help
      cd /workspace/clew && /root/.local/bin/uv run clew version
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/cli.py src/clew/ui/
      ```

      All must pass.

      ## 2. Adversarial probes (real end-to-end)

      In a fresh `/tmp/clew_e2e` dir:

      ```bash
      cd /tmp && rm -rf clew_e2e && mkdir clew_e2e && cd clew_e2e
      /root/.local/bin/uv run --project /workspace/clew clew init
      ```

      Then write a small Python script that uses the SDK to create a 5-span trace in
      `/tmp/clew_e2e/.clew/`, save it, exit. Run it.

      Then:
      ```bash
      /root/.local/bin/uv run --project /workspace/clew clew log           # should list the trace
      /root/.local/bin/uv run --project /workspace/clew clew log --json     # valid NDJSON
      /root/.local/bin/uv run --project /workspace/clew clew show <trace_id>          # tree
      /root/.local/bin/uv run --project /workspace/clew clew show <trace_id> --json   # valid NDJSON
      /root/.local/bin/uv run --project /workspace/clew clew branch feature-x         # creates branch
      /root/.local/bin/uv run --project /workspace/clew clew branches                  # lists both
      /root/.local/bin/uv run --project /workspace/clew clew checkout feature-x       # switches
      /root/.local/bin/uv run --project /workspace/clew clew replay <trace_id>        # creates new trace
      /root/.local/bin/uv run --project /workspace/clew clew diff <orig> <replay>     # shows diff
      /root/.local/bin/uv run --project /workspace/clew clew share <trace_id>         # creates tar.gz
      ls /tmp/clew_e2e/*.clew.tgz                                                       # exists
      tar tzf /tmp/clew_e2e/<trace_id>.clew.tgz | head                                # has manifest.json
      ```

