  # ──────────────────────────────────────────────────────────────────────
  # RELEASE — README, docs, CI, v0.1.0 tag
  # ──────────────────────────────────────────────────────────────────────
  - id: release
    title: 'README, docs, GitHub Actions CI, v0.1.0 tag'
    prompt: |
      Polish clew for **v0.1.0 release**. Read everything that was built (start with
      `/workspace/clew/ARCHITECTURE.md` and the README below).

      ## Files you OWN

      - `README.md` (overwrite existing if any)
      - `docs/QUICKSTART.md`
      - `docs/CLI.md`
      - `docs/SDK.md`
      - `CHANGELOG.md`
      - `examples/README.md`
      - `.github/workflows/ci.yml`
      - `.github/workflows/release.yml`
      - `tests/test_e2e.py`

      ## README.md requirements (THE KILLER)

      Must include ALL of:
      1. **Hero line + tagline** — "git for AI reasoning"
      2. **The problem** (2 paragraphs): current tools observe telemetry, not reasoning
      3. **The clew insight** (1 paragraph): Merkle DAG + content-addressing + branching
      4. **30-second quickstart** (5 copy-pasteable commands): `pip install clew` (or `uv add clew`) → init → record → branch → diff
      5. **Killer features list** (5-7 items with one-liners)
      6. **Architecture diagram** (ASCII or mermaid showing the DAG, branching, replay)
      7. **Comparison table** with columns: clew / LangSmith / Arize / Langfuse / agentlens
         - Rows: Local-first, Branching, Content-addressed, OTel-compatible, Open source, Single binary
         - clew should win on: local-first, branching, content-addressed, OTel, open source, single binary
      8. **CLI command reference** (link to docs/CLI.md)
      9. **SDK usage** (5-line code example with `@trace`)
      10. **Why clew wins** — the OSS winner thesis (network effects, standard adoption)
      11. **Contributing** pointer
      12. **License** (MIT)

      Tone: confident, technical, opinionated. Not corporate.

      ## docs/QUICKSTART.md
      5-minute walkthrough. Every command must be copy-pasteable and work end-to-end.

      ## docs/CLI.md
      Reference for all CLI commands with `--help` output and examples.

      ## docs/SDK.md
      Reference for all SDK APIs with examples. Include OTel bridge usage.

      ## CHANGELOG.md
      `## [0.1.0] - 2026-07-13` with sections: Added (initial MVP), Notes.
      Use Keep a Changelog format.

      ## CI (`.github/workflows/ci.yml`)
      - On push + pull_request
      - Matrix: Python 3.11, 3.12, 3.13
      - Steps: checkout, setup-python (with cache), install uv, `uv sync`, `uv run ruff check`, `uv run mypy --strict src/`, `uv run pytest -v`
      - Cache uv via `astral-sh/setup-uv@v1` or manual cache action

      ## Release workflow (`.github/workflows/release.yml`)
      - On tag push matching `v*`
      - Builds sdist + wheel
      - Publishes to PyPI via OIDC trusted publishing (`pypa/gh-action-pypi-publish@release/v1`)
      - Creates GitHub release with auto-generated notes

      ## examples/README.md
      Index of all examples with one-liner descriptions.

      ## tests/test_e2e.py
      - Full E2E test using `subprocess` to invoke the `clew` binary
      - Test cases: init in tmp, create trace via SDK, log/show/branch/diff/share via CLI
      - Asserts on exit codes and stdout
      - Uses `tmp_path` fixture

      ## Tag v0.1.0

      After all checks pass, run:
      ```bash
      cd /workspace/clew
      git init -q
      git add -A
      git -c user.email=ci@clew.dev -c user.name=clew commit -q -m "v0.1.0: initial MVP

      Features:
      - Content-addressed trace storage (Merkle DAG)
      - Git-style branching with refs and HEAD
      - Replay engine with mock + recording executors
      - Structural diff with text + JSON output
      - Python SDK (@trace decorator, OTel bridge)
      - Local-first single binary CLI (typer + rich)
      - OTel-compatible format (gen_ai.* attributes)
      - Portable signed bundles (share command)"
      git tag v0.1.0
      git log --oneline | head -5
      ```

      ## Acceptance criteria

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest -v
      cd /workspace/clew && /root/.local/bin/uv run ruff check .
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/
      cd /workspace/clew && git tag --list v0.1.0
      cd /workspace/clew && python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))" && echo "CI YAML valid"
      ```

      All must pass.

      ## Important

      - Do NOT remove or significantly rewrite core/CLI/SDK code
      - The README is THE most important file — make it stunning, opinionated, and clear
      - The "git for AI reasoning" tagline must be prominent
      - The comparison table is the marketing weapon — be specific
      - The killer features must be showcased in both README and quickstart

      ## Report when done

      - List every file created with line counts
      - The README word count
      - The git tag and commit hash
      - Test output (all green)
