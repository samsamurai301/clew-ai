      **FAIL** with specific probe name + exact issue otherwise.
    depends_on: []
    timeout_ms: 1500000  # 25 min

  # ──────────────────────────────────────────────────────────────────────
  # CORE-DATA — content-addressed storage, trace DAG, OTel format
  # ──────────────────────────────────────────────────────────────────────
  - id: core-data
    title: 'Content-addressed storage + trace DAG + OTel format'
    prompt: |
      Build the **data layer** of clew. Read first:
      - `/workspace/clew/ARCHITECTURE.md`
      - `/workspace/clew/PROTOCOL.md`
      - `/workspace/clew/src/clew/core/models.py` (the Pydantic models you must use)

      ## Files you OWN (do NOT touch any other file)

      - `src/clew/core/store.py` — content-addressed store
      - `src/clew/core/trace.py` — Trace DAG
      - `src/clew/core/format.py` — OTel-compatible format
      - `src/clew/utils/hash.py` — sha256 of canonical JSON
      - `src/clew/utils/paths.py` — `.clew/` directory management
      - `src/clew/utils/__init__.py` — empty marker
      - `tests/test_store.py`
      - `tests/test_trace.py`
      - `tests/test_format.py`
      - `tests/test_hash.py`

      ## Functional requirements

      ### `utils/hash.py`
      - `canonical_json(obj: Any) -> bytes` — RFC 8785-style canonical JSON (sort keys recursively, no whitespace, UTF-8)
      - `content_hash(obj: Any) -> str` — sha256 hex of `canonical_json(obj)`
      - `span_hash(span: Span) -> str` — hash a span's content (id, parent_ids, type, name, attributes, input, output, started_at, ended_at, status) — **NOT** including trace_id
      - Must be deterministic: same input → same hash, byte-for-byte

      ### `utils/paths.py`
      - `clew_root(cwd: Path | None = None) -> Path` — find or create `.clew/` in cwd or parents (max 5 levels)
      - `global_clew_root() -> Path` — `~/.clew/` via `platformdirs.user_data_dir("clew")`
      - Pure stdlib + `platformdirs` only

      ### `core/store.py`
      - `class Store(root: Path)` — opens a `.clew/` directory at `root`
      - Storage layout:
        - `root/spans/<id[:2]>/<id>.jsonl` — span lines (append-only, one JSON object per line)
        - `root/index.sqlite` — SQLite with table `spans(id PK TEXT, trace_id TEXT, type TEXT, name TEXT, started_at REAL, ended_at REAL, status TEXT, parent_ids TEXT, content_hash TEXT)`
        - `root/refs/<name>` — file containing one span_id (named branches, like git refs)
        - `root/HEAD` — file containing the current branch name
        - `root/manifest.json` — store metadata: `{"version": 1, "created_at": "..."}`
      - API:
        - `put(span: Span) -> str` — returns span.id, idempotent (no error on duplicate)
        - `get(span_id: str) -> Span` — raise KeyError if not found
        - `has(span_id: str) -> bool`
        - `iter_spans(trace_id: str | None = None) -> Iterator[Span]`
        - `iter_traces() -> Iterator[str]` — yield distinct trace_ids
      - Use `anyio.Lock` for async-safe writes (use `anyio.from_thread.run_sync` for sync interop)
      - JSONL file MUST be opened in append mode (`"a"`) — verify by reading your own code
      - On first open, if `index.sqlite` is missing, rebuild from JSONL files (synchronous rebuild is fine for MVP)
      - `manifest.json` is written on first init

      ### `core/trace.py`
      - `class TraceStore(store: Store)`
      - `add_span(span: Span) -> str` — append a span
      - `get_trace(trace_id: str) -> Trace` — return all spans for a trace, topologically sorted (parents before children)
      - `walk(root_span_id: str) -> Iterator[Span]` — DFS walk
      - `ancestors(span_id: str) -> list[Span]` — return parent chain (root first)
      - `descendants(span_id: str) -> list[Span]` — return all children (any depth)
      - `roots() -> list[Span]` — return all root spans (no parents)

      ### `core/format.py`
      - `to_otel(span: Span) -> dict` — convert `Span` → OTel-style dict with `gen_ai.*` attributes
      - `from_otel(otel_span: dict) -> Span` — parse OTel-style dict into `Span`
      - Honor these OTel semantic conventions:
        - `gen_ai.system` (openai/anthropic/google/etc.)
        - `gen_ai.request.model`
        - `gen_ai.usage.input_tokens` / `output_tokens`
        - `gen_ai.response.finish_reason`
        - `gen_ai.response.model`
        - `gen_ai.completion` (the response text)
        - Tool calls: `gen_ai.tool.name`, `gen_ai.tool.call.id`, `gen_ai.tool.call.arguments`

      ## Tests (pytest)

      - `test_hash.py`: canonical_json is deterministic, content_hash is sha256 hex (length 64), order-independent for dicts, span_hash is stable for same input
      - `test_store.py`: put/get roundtrip, dedup (put twice, file doesn't grow on second), iter by trace_id, has, manifest written on init
      - `test_trace.py`: walk visits parents before children, ancestors, descendants, roots, get_trace topological order
      - `test_format.py`: to_otel/from_otel roundtrip, a real-looking OpenAI completion span roundtrips, a tool-call span roundtrips

      ## Acceptance criteria

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_hash.py tests/test_store.py tests/test_trace.py tests/test_format.py -v
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/core/ src/clew/utils/
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/clew/core/store.py src/clew/core/trace.py src/clew/core/format.py src/clew/utils/
      ```

      All must pass. All output must be clean.

      ## Important

      - **Do NOT** touch `cli.py`, `sdk/`, `ui/`, `__init__.py`, `models.py`, `ARCHITECTURE.md`, `PROTOCOL.md`, `pyproject.toml`
      - Use `sqlite3` stdlib (NOT SQLAlchemy, NOT peewee)
      - Use `anyio` (NOT raw `asyncio`)
      - `Span` models from `core/models.py` are FROZEN — never mutate; create new ones with `model_copy(update=...)`
      - Public functions: type hints + docstrings (one line minimum)

      ## Report when done

      - Test output (must be all green)
      - Mypy output (must be clean)
      - Ruff output (must be clean)
      - List of files created with line counts
    assigned_to: Coder
    verified_by: Verifier
    verify_prompt: |
      You are verifying the **data layer** of clew. **Do NOT modify any project files.**
      Independent verification only — re-derive everything from the spec.

      ## 1. Re-run the producer's claims (don't trust them)

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_hash.py tests/test_store.py tests/test_trace.py tests/test_format.py -v
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/core/ src/clew/utils/
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/clew/core/store.py src/clew/core/trace.py src/clew/core/format.py src/clew/utils/
      ```

      All must be all-green / clean. Paste the output.

      ## 2. Adversarial probes (do these yourself, write your own scripts in /tmp)

      **Probe A — Content addressing is correct:**
      Write a script that constructs a `Span` with known fields, computes the SHA256
      manually using `canonical_json` from the clew utils, and confirms `span_hash(span)`
      matches. Test with: dict order swapped, nested dicts, datetime serialization.

      **Probe B — Dedup works:**
      In a temp dir, create a store, put the same span 5 times. The JSONL file must have
      exactly 1 line (not 5). The `index.sqlite` must have exactly 1 row.

      **Probe C — Append-only:**
      Read `src/clew/core/store.py` and confirm the JSONL file is opened in `"a"` mode,
      never `"w"` or `"r+"`. Cite the line.

      **Probe D — Index rebuild:**
      Create a store, put 10 spans, then `rm` the `index.sqlite` file, then re-open the
      store. Confirm `iter_spans()` still returns all 10 spans.

      **Probe E — OTel roundtrip with a real-looking span:**
      Construct a `Span` representing a `gpt-4o` completion with 150 input tokens,
      80 output tokens, finish_reason="stop", system="openai". Convert to OTel dict,
      convert back, confirm all fields match.

      **Probe F — Topological order:**
      Build a 4-span tree: root → child_a, child_b → grandchild. Call `get_trace()`.
      Confirm the returned order has root first, then children, then grandchild.

      **Probe G — Concurrent puts:**
      Spawn 10 threads, each putting 100 unique spans. After all complete, confirm
      the JSONL has exactly 1000 lines and the index has 1000 rows. Use `tempfile.mkdtemp()`.

      ## 3. Verdict

      **PASS** only if every check above passes. Paste the exact output of every command.

      **FAIL** with the specific check name and exact error/output otherwise. Be precise —
      the next cycle will retry from your feedback.
    depends_on: [foundation]
    timeout_ms: 1800000  # 30 min

  # ──────────────────────────────────────────────────────────────────────
  # CORE-SEMANTICS — branch + replay + diff
  # ──────────────────────────────────────────────────────────────────────
  - id: core-semantics
    title: 'Branch + replay + diff engines'
    prompt: |
      Build the **semantic layer** of clew. Read first:
      - `/workspace/clew/ARCHITECTURE.md`
      - `/workspace/clew/PROTOCOL.md`
      - `/workspace/clew/src/clew/core/store.py` and `trace.py` (built by core-data)

      ## Files you OWN (do NOT touch any other file)

      - `src/clew/core/branch.py` — branch manager (git-like refs)
      - `src/clew/core/replay.py` — replay engine
      - `src/clew/core/diff.py` — diff engine
      - `tests/test_branch.py`
      - `tests/test_replay.py`
      - `tests/test_diff.py`

      ## Functional requirements

      ### `core/branch.py`
      - `class BranchManager(store: TraceStore)`
      - API:
        - `create(name: str, head_span_id: str) -> Branch` — create a named branch
        - `get(name: str) -> Branch` — raise KeyError if not found
        - `list() -> list[Branch]` — list all branches sorted by name
        - `delete(name: str) -> None` — delete a branch
        - `current() -> str` — get the current branch name from `HEAD` file
        - `checkout(name: str) -> None` — switch current branch
        - `move(name: str, new_head_span_id: str) -> Branch` — move a branch
        - `diff(name1: str, name2: str) -> TraceDiff` — see `core/diff.py`
      - Branches are files at `.clew/refs/<name>` containing the span_id (one line)
      - HEAD is at `.clew/HEAD` containing the current branch name (one line)
      - Default branch is `"main"` — auto-created on first `BranchManager` init if no refs exist
      - Initial HEAD points to "main"

      ### `core/replay.py`
      - `class ReplayEngine(store: TraceStore, executor: ReplayExecutor | None = None)`
      - `class ReplayExecutor(Protocol)`:
        ```python
        async def execute(span: Span, ctx: ReplayContext) -> Span: ...
        ```
      - `class ReplayContext`: model (str), params (dict), env (dict), parent_chain (list[Span])
      - Built-in `class MockExecutor` — re-uses recorded outputs (re-execute returns the original span)
      - Built-in `class RecordingExecutor` — calls a user-provided async function and records outputs
      - `replay(trace_id: str, from_span_id: str | None = None, executor: ReplayExecutor | None = None) -> Trace`
        - Creates a **new** trace (new trace_id) — original is NEVER mutated
        - If `from_span_id` is None, replay from root
        - If `from_span_id` is given, replay that span and all its descendants
        - Ancestors are copied from the original (not re-executed)
      - `dry_run(trace_id: str, from_span_id: str | None = None) -> list[Span]` — return what WOULD be executed

      ### `core/diff.py`
      - `class TraceDiff`: trace_id_a, trace_id_b, added (list[Span]), removed (list[Span]), modified (list[tuple[Span, Span]]), unchanged_count
      - `diff(trace_a: Trace, trace_b: Trace) -> TraceDiff`
      - Spans are matched by their "path from root" (concatenation of `span.name` along the parent chain)
      - "modified" = same path, different content_hash
      - "added" = path exists in B but not A
      - "removed" = path exists in A but not B
      - "unchanged" = same path, same content_hash
      - `format_text(diff: TraceDiff) -> str` — pretty unified-diff-style output with color (use `rich`)
      - `format_json(diff: TraceDiff) -> str` — JSON for programmatic use

      ## Tests (pytest)

      - `test_branch.py`:
        - Default branch "main" created on first init
        - `create/get/list/delete` roundtrip
        - `current()` returns "main" initially
        - `checkout("feature-x")` updates HEAD
        - `move()` updates a branch pointer
        - Two branches with same root, different children, are independent
      - `test_replay.py`:
        - Replay from root creates a new trace_id
        - Replay from middle only re-executes that span and descendants
        - Original trace spans are unchanged after replay (compare content_hash)
        - `MockExecutor` returns original outputs (deterministic)
        - `RecordingExecutor` captures custom outputs
        - `dry_run` returns expected span list without executing
      - `test_diff.py`:
        - Identical traces → all "unchanged", 0 added/removed/modified
        - Trace B has extra span → 1 "added"
        - Trace B has modified span → 1 "modified"
        - `format_text` returns non-empty string with diff markers
        - `format_json` roundtrips (parse with `json.loads`)
        - Diff is deterministic (sorted by path)

      ## Acceptance criteria

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_branch.py tests/test_replay.py tests/test_diff.py -v
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/core/
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/clew/core/branch.py src/clew/core/replay.py src/clew/core/diff.py
      ```

      All must pass.

      ## Important

      - **Do NOT** touch CLI, SDK, data layer, models, or utils
      - **Branching is the killer feature** — make it feel like git
      - Replay must NEVER mutate the original trace (always new trace_id)
      - Diff must be deterministic and fast (no random ordering)
      - Use `anyio` for async, not raw `asyncio`
      - Use `rich` for `format_text` output

      ## Report when done

      - Test output (all green)
      - Mypy + ruff output (clean)
      - Files created with line counts
    assigned_to: Coder
    verified_by: Verifier
    verify_prompt: |
      You are verifying the **semantic layer** of clew. **Do NOT modify any project files.**

      ## 1. Re-run

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_branch.py tests/test_replay.py tests/test_diff.py -v
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/core/
      cd /workspace/clew && /root/.local/bin/uv run mypy --strict src/clew/core/branch.py src/clew/core/replay.py src/clew/core/diff.py
      ```

      All must pass cleanly.

      ## 2. Adversarial probes

      **Probe A — Branch isolation:**
      In a temp dir, build a 3-span trace (root → a → b). Create branch "main" at b.
      Create branch "alt" at a, then add a new child c under a (in alt's lineage). Confirm
      the two branches have different descendants and different head_span_ids.

      **Probe B — Replay non-destructive:**
      Build a 4-span trace. Record content_hashes. Replay the trace. Confirm the original
      trace's span content_hashes are byte-for-byte identical. Use `TraceStore.get_trace()`
      to compare.

      **Probe C — Replay from middle:**
      Build: root → mid → leaf. Replay with `from_span_id=mid.id`. Inspect the new trace:
      root should be copied (not re-executed), mid and leaf should be re-executed.

      **Probe D — Diff determinism + symmetry:**
      Build trace A, build trace B with 2 added spans and 1 modified. Compute `diff(A, B)`
      and `diff(B, A)`. Confirm: B→A has the same "modified" set, but added/removed are swapped.

      **Probe E — Refs on disk:**
      After creating a branch "feature-x", read the file `.clew/refs/feature-x`. Confirm
      it contains exactly the head_span_id (one line, no trailing whitespace).

      **Probe F — HEAD management:**
      `checkout` between three branches. After each, read `.clew/HEAD` and confirm it
      matches the current branch name.

      **Probe G — Default branch:**
      On a fresh `.clew/` (no prior state), opening a `BranchManager` must auto-create
      "main" and set HEAD to "main".

      ## 3. Verdict

      **PASS** only if every probe passes. Paste output of every command. **FAIL** with
      specific check name + exact error otherwise.
    depends_on: [core-data]
    timeout_ms: 1800000  # 30 min

  # ──────────────────────────────────────────────────────────────────────
  # SDK — Python SDK + OTel bridge + examples
  # ──────────────────────────────────────────────────────────────────────
  - id: sdk
    title: 'Python SDK + OTel bridge + example agent'
    prompt: |
      Build the **Python SDK** for clew. Read first:
      - `/workspace/clew/ARCHITECTURE.md`
      - `/workspace/clew/PROTOCOL.md`
      - The core layer (`store.py`, `trace.py`, `branch.py`, `replay.py`, `diff.py`)

      ## Files you OWN (do NOT touch any other file)

      - `src/clew/sdk/__init__.py` — public API
      - `src/clew/sdk/tracer.py` — `Tracer` class + `@tracer.span` decorator
      - `src/clew/sdk/context.py` — span context (task-local)
      - `src/clew/sdk/otel.py` — OTel bridge (lazy OTel import)
      - `examples/simple_agent.py` — minimal demo
      - `examples/branching_demo.py` — branching + diff demo
      - `tests/test_sdk.py`
      - `tests/test_context.py`

      ## Functional requirements

      ### `sdk/context.py`
      - `current_span() -> Span | None` — get the current span (returns None outside any span)
      - `set_current_span(span: Span | None) -> contextvars.Token` — set; returns token for reset
      - `reset_current_span(token: contextvars.Token) -> None` — restore previous
      - `current_trace_id() -> str | None` — convenience (from current span's trace_id)
      - Use `contextvars.ContextVar` under the hood (anyio is fine too, but stdlib is simpler)

      ### `sdk/tracer.py`
      - `class Tracer(store: TraceStore | None = None, name: str = "default")`
      - Lazy store creation: if `store` is None, create one at `cwd / ".clew"`
      - `@tracer.agent` — decorator for the entry point; creates a new trace
      - `@tracer.span(name: str, type: SpanType = SpanType.OBSERVATION)` — decorator for sync OR async functions
      - `tracer.trace(name: str, type: SpanType = SpanType.OBSERVATION)` — async + sync context managers
      - Behavior:
        - Capture function input/output automatically
        - Auto-close span on return
        - Exceptions become `SpanStatus.ERROR` with the exception message in attributes
        - Span ID is deterministic (use `span_hash()`) — same input → same span ID
        - Parent chain is tracked via `context.current_span()` (so nested calls just work)
        - Trace ID is the span ID of the `@tracer.agent` entry point

      ### `sdk/otel.py`
      - `class OTelBridge(tracer: Tracer)` — converts between OTel spans and clew spans
      - `to_otel_span(span: Span) -> dict` — convert a clew span to OTel-style dict
      - `from_otel_span(otel_dict: dict) -> Span` — convert OTel dict to clew span
      - `instrument_openai(client)` — monkey-patch an OpenAI client to emit clew spans
      - `instrument_anthropic(client)` — same for Anthropic
      - These helpers must work WITHOUT OTel installed (lazy import — wrapped in try/except)
      - They monkey-patch `client.chat.completions.create` (OpenAI) and `client.messages.create` (Anthropic)

      ### `examples/simple_agent.py`
      - Trivial agent: `plan → call_tool("search", q) → respond`
      - Uses `@tracer.agent` and `@tracer.span`
      - Tool call is a fake function (no real network)
      - Run: `uv run python examples/simple_agent.py`
      - Output: `Trace saved to /path/.clew/` + summary (number of spans, root name)

      ### `examples/branching_demo.py`
      - Run a 3-step "agent" with params={"model": "gpt-4o"}
      - Branch from the second span, change params={"model": "gpt-4o-mini"}
      - Replay the branch
      - Diff the original and the replay
      - Print the diff summary

      ## Tests (pytest)

      - `test_context.py`:
        - Nested spans have correct parent chain
        - `current_span()` returns None outside any span
        - `set_current_span` + `reset_current_span` roundtrip
        - Concurrent `anyio` tasks have isolated span chains
      - `test_sdk.py`:
        - `@tracer.span` captures input + output
        - Exception becomes `SpanStatus.ERROR`
        - Sync and async functions both work
        - Same input twice → same span ID (deterministic)
        - Lazy store creation works in a tmp dir

      ## Acceptance criteria

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_sdk.py tests/test_context.py -v
      cd /workspace/clew && /root/.local/bin/uv run python examples/simple_agent.py
      cd /workspace/clew && /root/.local/bin/uv run python examples/branching_demo.py
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/sdk/ examples/
      ```

      All must pass.

      ## Important

      - **Do NOT** touch CLI, core, or utils
      - SDK must work without OTel installed (lazy import in `otel.py`)
      - `Span` models are FROZEN — use `model_copy(update=...)` for "modified" versions
      - Public API surface (exported from `sdk/__init__.py`):
        - `Tracer`, `SpanType`, `SpanStatus`, `Span`, `Trace`
        - `current_span`, `current_trace_id`
        - `OTelBridge`, `instrument_openai`, `instrument_anthropic`

      ## Report when done

      - Test output (all green)
      - Output of `python examples/simple_agent.py`
      - Output of `python examples/branching_demo.py`
      - Files created with line counts
    assigned_to: Coder
    verified_by: Verifier
    verify_prompt: |
      You are verifying the **Python SDK** of clew. **Do NOT modify any project files.**

      ## 1. Re-run

      ```bash
      cd /workspace/clew && /root/.local/bin/uv run pytest tests/test_sdk.py tests/test_context.py -v
      cd /workspace/clew && /root/.local/bin/uv run python examples/simple_agent.py
      cd /workspace/clew && /root/.local/bin/uv run python examples/branching_demo.py
      cd /workspace/clew && /root/.local/bin/uv run ruff check src/clew/sdk/ examples/
      ```

      All must pass. Examples must exit 0.

      ## 2. Adversarial probes

      **Probe A — One-liner onboarding test:**
      Write a 5-line script in /tmp:
      ```python
      from clew.sdk import Tracer
      t = Tracer()
      @t.span("hello")
      def f(x): return x * 2
      f(21)
      ```
      Run it with `uv run --project /workspace/clew`. Confirm a `.clew/` is created and
      `clew log` (run separately) shows the trace.

      **Probe B — Async isolation:**
      Spawn 10 `anyio` tasks, each running a different `@tracer.span` chain. Confirm
